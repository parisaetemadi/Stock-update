name: Update clinical trials (weekly)

# The registry moves far slower than the news does — a trial's phase changes
# over months — so a weekly sweep is the right cadence. Monday morning UTC;
# GitHub runs scheduled jobs late and at a drifting hour, which is fine here.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the ranking logic before trusting it
        run: node scripts/trials-rank.test.mjs

      - name: Sweep ClinicalTrials.gov
        run: node scripts/update-trials.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Automated weekly trials refresh"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          git push
