name: Update dashboard prices

on:
  schedule:
    # Eight fixed entries rather than '*/10', for the reason the macro workflow
    # already uses fixed hours: GitHub sheds frequent schedules under load. The
    # '*/10' this replaces asked for ~1,300 runs in 72 hours and got 13 — about
    # one every five and a half hours. The daily entries in this repository
    # fired 53 times out of 53. Asking for eight a day should therefore deliver
    # *more* actual refreshes than asking for 144, not fewer.
    #
    # :17 rather than :00 because the top of the hour is the most congested
    # minute on the shared runners, and a schedule there waits behind everyone
    # else's.
    - cron: '17 0,3,6,9,12,15,18,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Same guard the macro and trials workflows use: check the parsing
      # before trusting what it publishes, since this job commits straight to
      # main and the dashboard reads whatever lands there.
      - name: Check the parsing before trusting it
        run: |
          node scripts/yahoo.test.mjs
          node scripts/fred.test.mjs

      - name: Fetch market data
        run: node scripts/update-market.mjs

      - name: Fetch watchlist prices
        run: node scripts/update-watchlist.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/watchlist.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Automated price refresh"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          git push
