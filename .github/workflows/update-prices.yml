name: Update dashboard prices

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch market data
        run: node scripts/update-market.mjs

      - name: Fetch watchlist prices
        run: node scripts/update-watchlist.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/watchlist.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Automated price refresh"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          git push
