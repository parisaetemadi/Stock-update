name: Update dashboard data (daily)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch biotech headlines
        run: node scripts/update-biotech.mjs

      - name: Fetch macro indicators
        run: node scripts/update-econ.mjs

      - name: Fetch earnings dates
        run: node scripts/update-earnings.mjs

      - name: Fetch trailing returns
        run: node scripts/update-returns.mjs

      - name: Fetch drug value chain market data
        run: node scripts/update-drugchain.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/biotech.json data/econ.json data/earnings.json data/returns.json data/drugchain.json
          git diff --cached --quiet || git commit -m "Automated daily data refresh"
          git push
