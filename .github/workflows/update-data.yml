name: Update dashboard data (daily)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch biotech headlines
        run: node scripts/update-biotech.mjs

      - name: Fetch macro indicators
        run: node scripts/update-econ.mjs

      - name: Fetch earnings dates
        run: node scripts/update-earnings.mjs

      - name: Fetch trailing returns
        run: node scripts/update-returns.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Automated daily data refresh"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
          done
          git push
