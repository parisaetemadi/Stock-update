name: Update dashboard data (daily)

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch biotech headlines
        run: node scripts/update-biotech.mjs

      - name: Fetch macro indicators
        run: node scripts/update-econ.mjs

      - name: Fetch earnings dates
        run: node scripts/update-earnings.mjs

      - name: Fetch trailing returns
        run: node scripts/update-returns.mjs

      # The four feeds above are established and the dashboard depends on them.
      # This one is newer and depends on an endpoint Yahoo sometimes refuses, so
      # it must not be able to stop their commit: on failure the previous
      # drugchain.json stays in place and the rest still lands.
      - name: Fetch drug value chain market data
        continue-on-error: true
        run: node scripts/update-drugchain.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Automated daily data refresh"
          git push
