name: Verify raw CORS headers

# One-off check that raw.githubusercontent.com actually serves these files with
# a permissive CORS header, since the dashboard fetches them cross-origin.
# Safe to delete once confirmed.

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check headers and casing
        run: |
          for repo in Stock-update stock-update; do
            url="https://raw.githubusercontent.com/parisaetemadi/$repo/main/data/market.json"
            echo "=== $url ==="
            curl -sS -o /dev/null -D - \
              -H 'Origin: https://example.pages.dev' "$url" \
              | grep -Ei '^(HTTP/|access-control-allow-origin|cache-control|content-type)' || true
            echo
          done
